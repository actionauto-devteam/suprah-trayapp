name: Build Tray App

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: |
          echo "CRM_URL=${{ secrets.TRAY_CRM_URL }}" > .env
          echo "API_URL=${{ secrets.TRAY_API_URL }}" >> .env

      - name: Build macOS DMG + ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac -- --publish always

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ActionAutoTraySetup-mac
          path: |
            release/*.dmg
            release/*.dmg.blockmap
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        shell: bash
        run: |
          echo "CRM_URL=${{ secrets.TRAY_CRM_URL }}" > .env
          echo "API_URL=${{ secrets.TRAY_API_URL }}" >> .env

      - name: Build Windows EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build -- --publish always

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActionAutoTraySetup-windows
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          retention-days: 30
