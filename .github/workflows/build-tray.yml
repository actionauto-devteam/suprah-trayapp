name: Build Tray App

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: |
          echo "CRM_URL=${{ secrets.TRAY_CRM_URL }}" > .env
          echo "API_URL=${{ secrets.TRAY_API_URL }}" >> .env

      - name: Build macOS DMG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:mac

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActionAutoTraySetup-mac
          path: dist/*.dmg
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        shell: bash
        run: |
          echo "CRM_URL=${{ secrets.TRAY_CRM_URL }}" > .env
          echo "API_URL=${{ secrets.TRAY_API_URL }}" >> .env

      - name: Build Windows EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ActionAutoTraySetup-windows
          path: dist/*.exe
          retention-days: 30
