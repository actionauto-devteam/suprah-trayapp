<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Action Auto — Status</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      color: #e5e5e5;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .card {
      background: #111111;
      border: 1px solid #222;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04);
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: white;
      flex-shrink: 0;
    }

    .user-info { flex: 1; min-width: 0; }

    .user-name {
      font-size: 13px;
      font-weight: 700;
      color: #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-role {
      font-size: 10px;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      margin-top: 1px;
    }

    .agent-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
    }
    .agent-dot.online { background: #16a34a; box-shadow: 0 0 6px rgba(22,163,74,0.5); }
    .agent-dot.offline { background: #555; }

    /* Status section */
    .status-section {
      padding: 14px 16px;
      border-bottom: 1px solid #1a1a1a;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .status-pill.on-shift {
      background: rgba(22,163,74,0.12);
      color: #4ade80;
      border: 1px solid rgba(22,163,74,0.2);
    }

    .status-pill.on-break {
      background: rgba(249,115,22,0.12);
      color: #fb923c;
      border: 1px solid rgba(249,115,22,0.2);
    }

    .status-pill.idle {
      background: rgba(161,161,170,0.08);
      color: #a1a1aa;
      border: 1px solid rgba(161,161,170,0.15);
    }

    .status-pill.offline {
      background: rgba(100,100,100,0.08);
      color: #555;
      border: 1px solid #222;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-dot.pulse { animation: pulse 1.5s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Timers */
    .timers {
      padding: 14px 16px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timer-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #444;
    }

    .timer-value {
      font-size: 18px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
      color: #f0f0f0;
    }

    .timer-value.break { color: #fb923c; }
    .timer-value.idle  { color: #71717a; }

    .screenshot-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .screenshot-label {
      font-size: 10px;
      color: #333;
      font-weight: 600;
    }

    .screenshot-val {
      font-size: 11px;
      font-weight: 700;
      color: #3f3f3f;
      font-variant-numeric: tabular-nums;
    }

    /* Actions */
    .actions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: auto;
    }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
      letter-spacing: 0.02em;
    }

    .btn-primary {
      background: #16a34a;
      color: white;
    }
    .btn-primary:hover { background: #15803d; }

    .btn-ghost {
      background: #161616;
      color: #555;
      border: 1px solid #222;
    }
    .btn-ghost:hover { background: #1c1c1c; color: #888; }

    .btn-danger {
      background: transparent;
      color: #3f3f3f;
      border: 1px solid #1e1e1e;
    }
    .btn-danger:hover { color: #f87171; border-color: rgba(248,113,113,0.2); }
  </style>
</head>
<body>
  <div class="card">

    <!-- Header -->
    <div class="header">
      <div class="avatar" id="avatar">AA</div>
      <div class="user-info">
        <p class="user-name" id="userName">Loading…</p>
        <p class="user-role" id="userRole">Employee</p>
      </div>
      <div class="agent-dot" id="agentDot"></div>
    </div>

    <!-- Status pill -->
    <div class="status-section">
      <div class="status-pill offline" id="statusPill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Not Clocked In</span>
      </div>
    </div>

    <!-- Timers -->
    <div class="timers">
      <div class="timer-row">
        <span class="timer-label">Shift Time</span>
        <span class="timer-value" id="shiftTimer">--:--:--</span>
      </div>
      <div class="timer-row" id="breakRow" style="display:none">
        <span class="timer-label">Break Time</span>
        <span class="timer-value break" id="breakTimer">--:--:--</span>
      </div>
      <div class="screenshot-row" id="screenshotRow" style="display:none">
        <span class="screenshot-label">Next screenshot in</span>
        <span class="screenshot-val" id="screenshotCountdown">--:--</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" id="openCrmBtn">Open CRM</button>
      <button class="btn btn-danger" id="signOutBtn">Sign Out</button>
    </div>

  </div>

  <script>
    let state = {};
    let shiftInterval = null;
    let breakInterval = null;
    let screenshotInterval = null;

    const fmt = (totalSec) => {
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    };

    const fmtMM = (totalSec) => {
      const m = Math.floor(totalSec / 60);
      const s = totalSec % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    };

    const initials = (name) => {
      if (!name) return 'AA';
      return name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
    };

    const startShiftTimer = () => {
      if (!state.shiftStartedAt) return;
      clearInterval(shiftInterval);
      shiftInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - new Date(state.shiftStartedAt).getTime()) / 1000);
        document.getElementById('shiftTimer').textContent = fmt(elapsed);
      }, 1000);
    };

    const startBreakTimer = () => {
      if (!state.breakStartedAt) return;
      clearInterval(breakInterval);
      breakInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - new Date(state.breakStartedAt).getTime()) / 1000);
        document.getElementById('breakTimer').textContent = fmt(elapsed);
      }, 1000);
    };

    const startScreenshotCountdown = () => {
      clearInterval(screenshotInterval);
      screenshotInterval = setInterval(() => {
        if (!state.nextScreenshotIn) return;
        const remaining = Math.max(0, Math.floor((new Date(state.nextScreenshotIn).getTime() - Date.now()) / 1000));
        document.getElementById('screenshotCountdown').textContent = fmtMM(remaining);
      }, 1000);
    };

    const applyState = (s) => {
      state = s;

      // Avatar + name
      document.getElementById('avatar').textContent = initials(s.user?.fullName);
      document.getElementById('userName').textContent = s.user?.fullName || '—';
      document.getElementById('userRole').textContent = s.user?.role || 'Employee';

      // Agent connectivity dot
      const dot = document.getElementById('agentDot');
      dot.className = 'agent-dot ' + (s.isAgentOnline ? 'online' : 'offline');

      // Status pill
      const pill = document.getElementById('statusPill');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      clearInterval(shiftInterval);
      clearInterval(breakInterval);
      clearInterval(screenshotInterval);

      document.getElementById('breakRow').style.display = 'none';
      document.getElementById('screenshotRow').style.display = 'none';
      document.getElementById('shiftTimer').textContent = '--:--:--';

      if (s.isOnBreak) {
        pill.className = 'status-pill on-break';
        statusDot.className = 'status-dot pulse';
        statusText.textContent = 'On Break';
        document.getElementById('breakRow').style.display = 'flex';
        startBreakTimer();
        if (s.shiftStartedAt) startShiftTimer();
      } else if (s.isIdle) {
        pill.className = 'status-pill idle';
        statusDot.className = 'status-dot';
        statusText.textContent = 'Idle — Screenshots Paused';
        if (s.shiftStartedAt) startShiftTimer();
      } else if (s.isOnShift) {
        pill.className = 'status-pill on-shift';
        statusDot.className = 'status-dot pulse';
        statusText.textContent = 'On Shift';
        if (s.shiftStartedAt) startShiftTimer();
        if (s.nextScreenshotIn) {
          document.getElementById('screenshotRow').style.display = 'flex';
          startScreenshotCountdown();
        }
      } else {
        pill.className = 'status-pill offline';
        statusDot.className = 'status-dot';
        statusText.textContent = 'Not Clocked In';
      }
    };

    // Buttons
    document.getElementById('openCrmBtn').addEventListener('click', () => {
      window.trayAPI.openCRM();
    });

    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await window.trayAPI.logout();
    });

    // Listen for state updates from main process
    window.trayAPI.onStatusUpdate((data) => applyState(data));

    // Request initial state
    window.trayAPI.getStatus().then(applyState);
  </script>
</body>
</html>
