<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Action Auto — Status</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: transparent;
      color: #e5e5e5;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    .card {
      background: #111111;
      border: 1px solid #222;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.04);
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 16px 16px 12px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #16a34a, #15803d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: white;
      flex-shrink: 0;
    }

    .user-info { flex: 1; min-width: 0; }

    .user-name {
      font-size: 13px;
      font-weight: 700;
      color: #f0f0f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-role {
      font-size: 10px;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      margin-top: 1px;
    }

    .agent-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
    }
    .agent-dot.online { background: #16a34a; box-shadow: 0 0 6px rgba(22,163,74,0.5); }
    .agent-dot.offline { background: #555; }

    /* Status section */
    .status-section {
      padding: 14px 16px;
      border-bottom: 1px solid #1a1a1a;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .status-pill.on-shift {
      background: rgba(22,163,74,0.12);
      color: #4ade80;
      border: 1px solid rgba(22,163,74,0.2);
    }

    .status-pill.on-break {
      background: rgba(249,115,22,0.12);
      color: #fb923c;
      border: 1px solid rgba(249,115,22,0.2);
    }

    .status-pill.idle {
      background: rgba(161,161,170,0.08);
      color: #a1a1aa;
      border: 1px solid rgba(161,161,170,0.15);
    }

    .status-pill.offline {
      background: rgba(100,100,100,0.08);
      color: #555;
      border: 1px solid #222;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-dot.pulse { animation: pulse 1.5s ease-in-out infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Timers */
    .timers {
      padding: 14px 16px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .timer-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #444;
    }

    .timer-value {
      font-size: 18px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.5px;
      color: #f0f0f0;
    }

    .timer-value.break      { color: #fb923c; }
    .timer-value.over-break { color: #f87171; }
    .timer-value.idle       { color: #71717a; }

    /* Actions */
    .actions {
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: auto;
    }

    .btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
      letter-spacing: 0.02em;
    }

    .btn-primary {
      background: #16a34a;
      color: white;
    }
    .btn-primary:hover { background: #15803d; }

    .btn-ghost {
      background: #161616;
      color: #555;
      border: 1px solid #222;
    }
    .btn-ghost:hover { background: #1c1c1c; color: #888; }

    .btn-danger {
      background: transparent;
      color: #3f3f3f;
      border: 1px solid #1e1e1e;
    }
    .btn-danger:hover { color: #f87171; border-color: rgba(248,113,113,0.2); }

    .btn-break {
      background: rgba(251,146,60,0.06);
      color: #fb923c;
      border: 1px solid rgba(251,146,60,0.18);
    }
    .btn-break:hover { background: rgba(251,146,60,0.12); }

    .btn-resume {
      background: rgba(74,222,128,0.06);
      color: #4ade80;
      border: 1px solid rgba(74,222,128,0.18);
    }
    .btn-resume:hover { background: rgba(74,222,128,0.12); }

    .btn-end-shift {
      background: transparent;
      color: #444;
      border: 1px solid #1e1e1e;
      font-size: 11px;
    }
    .btn-end-shift:hover { color: #f87171; border-color: rgba(248,113,113,0.2); }

    .btn-row {
      display: flex;
      gap: 6px;
    }
    .btn-row .btn { width: auto; flex: 1; }

    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .action-msg {
      font-size: 10px;
      text-align: center;
      color: #444;
      min-height: 13px;
    }
  </style>
</head>
<body>
  <div class="card">

    <!-- Header -->
    <div class="header">
      <div class="avatar" id="avatar">AA</div>
      <div class="user-info">
        <p class="user-name" id="userName">Loading…</p>
        <p class="user-role" id="userRole">Employee</p>
      </div>
      <div class="agent-dot" id="agentDot"></div>
    </div>

    <!-- Status pill -->
    <div class="status-section">
      <div class="status-pill offline" id="statusPill">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Not Clocked In</span>
      </div>
    </div>

    <!-- Timers -->
    <div class="timers">
      <div class="timer-row">
        <span class="timer-label">Work Time</span>
        <span class="timer-value" id="shiftTimer">00:00:00</span>
      </div>
      <div class="timer-row" id="breakRow" style="display:none">
        <span class="timer-label">Total Break</span>
        <span class="timer-value break" id="breakTimer">--:--:--</span>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" id="startShiftBtn" style="display:none">Start Shift</button>
      <div class="btn-row" id="shiftActions" style="display:none">
        <button class="btn btn-break" id="breakBtn">Break</button>
        <button class="btn btn-end-shift" id="endShiftBtn">End Shift</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-ghost" id="openCrmBtn">Open CRM</button>
        <button class="btn btn-danger" id="signOutBtn">Sign Out</button>
      </div>
      <p class="action-msg" id="actionMsg"></p>
    </div>

  </div>

  <script>
    let state = {};
    let timerInterval = null;
    let breakInterval = null;

    const fmt = (totalSec) => {
      const s = Math.max(0, Math.floor(totalSec));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    };

    const initials = (name) => {
      if (!name) return 'AA';
      return name.split(' ').slice(0, 2).map(w => w[0]).join('').toUpperCase();
    };

    // Activity-based work timer: counts only completed intervals + live interval
    const updateWorkTimer = () => {
      const prevMs = state.todayTotalActiveMs || 0;
      const liveMs = state.activityStartMs
        ? Math.max(0, Date.now() - state.activityStartMs)
        : 0;
      document.getElementById('shiftTimer').textContent = fmt(Math.floor((prevMs + liveMs) / 1000));
    };

    const updateBreakDisplay = () => {
      const liveSec = state.breakStartedAt
        ? Math.floor((Date.now() - new Date(state.breakStartedAt).getTime()) / 1000)
        : 0;
      const totalSec = Math.floor(state.totalBreakSeconds || 0) + liveSec;
      const el = document.getElementById('breakTimer');
      if (!el) return;
      el.textContent = fmt(totalSec);
      el.className = 'timer-value ' + (totalSec >= 3600 ? 'over-break' : 'break');
    };

    const applyState = (s) => {
      state = s;

      // Avatar + name
      document.getElementById('avatar').textContent = initials(s.user?.fullName);
      document.getElementById('userName').textContent = s.user?.fullName || '—';
      document.getElementById('userRole').textContent = s.user?.role || 'Employee';

      // Agent connectivity dot
      const dot = document.getElementById('agentDot');
      dot.className = 'agent-dot ' + (s.isAgentOnline ? 'online' : 'offline');

      // Status pill + timer logic
      const pill = document.getElementById('statusPill');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      clearInterval(timerInterval);
      clearInterval(breakInterval);
      document.getElementById('breakRow').style.display = 'none';

      if (s.isOnBreak) {
        pill.className = 'status-pill on-break';
        statusDot.className = 'status-dot pulse';
        statusText.textContent = 'On Break';
        document.getElementById('breakRow').style.display = 'flex';
        updateBreakDisplay();
        breakInterval = setInterval(updateBreakDisplay, 1000);
      } else if (s.isOnShift && s.isIdle) {
        pill.className = 'status-pill idle';
        statusDot.className = 'status-dot';
        statusText.textContent = 'Idle — Paused';
      } else if (s.isOnShift) {
        pill.className = 'status-pill on-shift';
        statusDot.className = 'status-dot pulse';
        statusText.textContent = 'On Shift';
      } else if ((s.todayTotalActiveMs || 0) > 0) {
        pill.className = 'status-pill offline';
        statusDot.className = 'status-dot';
        statusText.textContent = 'Shift Complete';
      } else {
        pill.className = 'status-pill offline';
        statusDot.className = 'status-dot';
        statusText.textContent = 'Not Clocked In';
      }

      // Work timer always ticking (pauses automatically when activityStartMs is null)
      updateWorkTimer();
      timerInterval = setInterval(updateWorkTimer, 1000);

      updateButtons(s);
    };

    const showMsg = (msg, isError = false) => {
      const el = document.getElementById('actionMsg');
      el.textContent = msg;
      el.style.color = isError ? '#f87171' : '#555';
      setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, 3000);
    };

    const updateButtons = (s) => {
      const startShiftBtn = document.getElementById('startShiftBtn');
      const shiftActions  = document.getElementById('shiftActions');
      const breakBtn      = document.getElementById('breakBtn');
      if (!s.isAuthenticated) {
        startShiftBtn.style.display = 'none';
        shiftActions.style.display  = 'none';
        return;
      }
      if (!s.isOnShift) {
        startShiftBtn.style.display = '';
        shiftActions.style.display  = 'none';
      } else {
        startShiftBtn.style.display = 'none';
        shiftActions.style.display  = 'flex';
        if (s.isOnBreak) {
          breakBtn.textContent = 'Resume';
          breakBtn.className   = 'btn btn-resume';
        } else {
          breakBtn.textContent = 'Break';
          breakBtn.className   = 'btn btn-break';
        }
      }
    };

    // ── Timeclock button handlers ────────────────────────────────────
    document.getElementById('startShiftBtn').addEventListener('click', async () => {
      const btn = document.getElementById('startShiftBtn');
      btn.disabled = true;
      const result = await window.trayAPI.timeclockAction('time-in');
      btn.disabled = false;
      if (!result.success) showMsg(result.error || 'Failed', true);
    });

    document.getElementById('breakBtn').addEventListener('click', async () => {
      const btn = document.getElementById('breakBtn');
      btn.disabled = true;
      const type = state.isOnBreak ? 'break-out' : 'break-in';
      const result = await window.trayAPI.timeclockAction(type);
      btn.disabled = false;
      if (!result.success) showMsg(result.error || 'Failed', true);
    });

    document.getElementById('endShiftBtn').addEventListener('click', async () => {
      const btn = document.getElementById('endShiftBtn');
      btn.disabled = true;
      const result = await window.trayAPI.timeclockAction('time-out');
      btn.disabled = false;
      if (!result.success) showMsg(result.error || 'Failed', true);
    });

    document.getElementById('openCrmBtn').addEventListener('click', () => {
      window.trayAPI.openCRM();
    });

    document.getElementById('signOutBtn').addEventListener('click', async () => {
      await window.trayAPI.logout();
    });

    // ── State sync ───────────────────────────────────────────────────
    window.trayAPI.onStatusUpdate((data) => applyState(data));
    window.trayAPI.getStatus().then(applyState);
  </script>
</body>
</html>
